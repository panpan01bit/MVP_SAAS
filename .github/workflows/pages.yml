name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            admin/package-lock.json
            h5/package-lock.json

      - name: Install Admin dependencies
        working-directory: ./admin
        run: npm ci

      - name: Install H5 dependencies
        working-directory: ./h5
        run: npm ci

      - name: Build Admin
        working-directory: ./admin
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: ''
          VITE_BASE_PATH: /MVP_SAAS/admin/

      - name: Build H5
        working-directory: ./h5
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: ''
          VITE_BASE_PATH: /MVP_SAAS/h5/

      - name: Assemble site
        run: |
          mkdir -p dist-site
          cp pages/index.html dist-site/
          cp -r admin/dist dist-site/admin
          cp -r h5/dist dist-site/h5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
