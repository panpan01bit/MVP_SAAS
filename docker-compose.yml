version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: toolfix-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: toolfix
      MYSQL_USER: toolfix
      MYSQL_PASSWORD: toolfix123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: toolfix-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: toolfix-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: toolfix-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-toolfix}
      MYSQL_USER: ${MYSQL_USER:-toolfix}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-toolfix123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      # 演示全链路：H5 地址指向容器映射端口
      H5_BASE_URL: ${H5_BASE_URL:-http://localhost:5173}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload-data:/tmp/toolfix/uploads

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: toolfix-admin
    ports:
      - "3000:80"
    depends_on:
      - backend

  h5:
    build:
      context: ./h5
      dockerfile: Dockerfile
    container_name: toolfix-h5
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
  upload-data:

networks:
  default:
    name: toolfix-network
