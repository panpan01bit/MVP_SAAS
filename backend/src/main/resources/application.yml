server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: toolfix-backend
  
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:toolfix}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:toolfix}
    password: ${MYSQL_PASSWORD:toolfix123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Application Configuration
toolfix:
  links:
    # H5 前端地址（生成诊断链接用，docker 环境由 compose 注入）
    h5-base-url: ${H5_BASE_URL:http://localhost:5173}
  security:
    hmac-secret: ${HMAC_SECRET:toolfix-super-secret-key-for-demo-only-change-in-production}
    link-expiry-days: 7
    # 后台演示账号
    demo-admin-email: ${DEMO_ADMIN_EMAIL:demo@toolfix.com}
    demo-admin-password: ${DEMO_ADMIN_PASSWORD:demo123}
  llm:
    # 留空 api-key 时自动降级为 Mock 模式
    base-url: ${LLM_BASE_URL:https://open.bigmodel.cn/api/coding/paas/v4}
    api-key: ${LLM_API_KEY:}
    vision-model: ${LLM_MODEL:glm-4.5v}
    text-model: ${LLM_TEXT_MODEL:glm-4.6}
    disable-thinking: ${LLM_DISABLE_THINKING:true}
  
  ai:
    mock-enabled: true
    max-conversation-rounds: 5
    confidence-threshold: 0.7
    response-delay-ms: 1500
  
  shopify:
    mock-enabled: true
    client-id: ${SHOPIFY_CLIENT_ID:demo-client-id}
    client-secret: ${SHOPIFY_CLIENT_SECRET:demo-client-secret}
    redirect-uri: ${SHOPIFY_REDIRECT_URI:http://localhost:3000/shopify/callback}
  
  storage:
    upload-dir: ${UPLOAD_DIR:/tmp/toolfix/uploads}
    
  notification:
    seller-email: ${SELLER_EMAIL:seller@toolfix.demo}

logging:
  level:
    root: INFO
    com.toolfix: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
