# 本地裸跑模式：无 MySQL/Redis/Docker，H2 内存库
# 启动: SPRING_PROFILES_ACTIVE=local mvn spring-boot:run
spring:
  datasource:
    url: jdbc:h2:mem:toolfix;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update

logging:
  level:
    com.toolfix: INFO
